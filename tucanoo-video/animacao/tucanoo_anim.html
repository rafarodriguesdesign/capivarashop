<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tucanoo acenando</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #FFE3B4; }
  body { display: flex; align-items: center; justify-content: center; }
  svg { display: block; width: min(100vw, 100vh); height: min(100vw, 100vh); }
</style>
</head>
<body>
<!--
  Tucanoo acenando: animação em loop do ícone, inspirada no vídeo do flamingo
  (a asa sai da moldura e acena, o tucano pisca, abre o bico e balança a cabeça).

  - Aberta no navegador, a animação roda ao vivo.
  - O render.js usa window.renderFrame(t) para desenhar cada quadro (t em segundos).
  - As coordenadas internas são as mesmas do SVG original do ícone (0 a 240).
-->
<svg id="svg" xmlns="http://www.w3.org/2000/svg" viewBox="-110 -80 400 400">
  <defs>
    <linearGradient id="gBg" x1="120.75" y1="42.0213" x2="120.75" y2="193.998" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFBD31"/><stop offset="1" stop-color="#DE4101"/>
    </linearGradient>
    <linearGradient id="gNavy" x1="87.4604" y1="189.508" x2="171.397" y2="49.1729" gradientUnits="userSpaceOnUse">
      <stop stop-color="#01071A"/><stop offset="1" stop-color="#042966"/>
    </linearGradient>
    <linearGradient id="gEye" x1="70.5328" y1="125.054" x2="80.7976" y2="107.08" gradientUnits="userSpaceOnUse">
      <stop stop-color="#01071A"/><stop offset="1" stop-color="#042966"/>
    </linearGradient>
    <linearGradient id="gJaw" x1="95.2383" y1="122.365" x2="203.427" y2="150.275" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFAE01"/><stop offset="1" stop-color="#D52400"/>
    </linearGradient>
    <linearGradient id="gTip" x1="181.145" y1="138.886" x2="204.27" y2="130.891" gradientUnits="userSpaceOnUse">
      <stop stop-color="#01071A"/><stop offset="1" stop-color="#042966"/>
    </linearGradient>
    <linearGradient id="gWing" x1="30" y1="215" x2="-55" y2="95" gradientUnits="userSpaceOnUse">
      <stop stop-color="#01071A"/><stop offset="1" stop-color="#042966"/>
    </linearGradient>

    <clipPath id="cIcon"><rect width="240" height="240" rx="32"/></clipPath>
    <clipPath id="cBody"><path id="bodyClipPath"/></clipPath>
    <!-- região abaixo da linha da boca (entre a mandíbula de cima e a de baixo) -->
    <clipPath id="cBelowB">
      <path d="M60 113.81L95.3198 113.814C95.3333 113.666 130.085 110.901 157.773 130.767C160.911 131.495 166.311 134.815 168.29 136.077C174.2 139.934 196.106 137.872 192.098 149.798L240 149.8L240 220L60 220Z"/>
    </clipPath>

    <filter id="fWingShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="2.2" dy="3.2" stdDeviation="3.2" flood-color="#7A2A00" flood-opacity="0.28"/>
    </filter>
    <filter id="fIconShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="9" flood-color="#B84A00" flood-opacity="0.22"/>
    </filter>
  </defs>

  <!-- fundo -->
  <rect id="outer" x="-110" y="-80" width="400" height="400" fill="#FFE3B4"/>

  <!-- ícone -->
  <rect width="240" height="240" rx="32" fill="url(#gBg)" filter="url(#fIconShadow)"/>

  <g clip-path="url(#cIcon)">
    <g id="char">
      <!-- base branca: rosto e as frestas brancas do logo -->
      <path fill="#fff" d="M19.2427 173.748C18.8517 172.828 18.4831 171.893 18.1379 170.944C15.8581 164.674 14.5978 157.785 14.5978 150.555C14.5978 121.536 34.8981 98.012 59.9396 98.012C63.2961 98.012 66.5603 98.3733 69.6967 99.0687C72.8818 83.5008 86.6561 71.7898 103.166 71.7898C122.033 71.7898 137.329 87.085 137.329 105.953C137.329 124.379 122.741 139.398 104.484 140.091C104.751 142.374 104.889 144.725 104.889 147.138C104.889 148.276 104.881 149.4 104.82 150.531C109.215 162.985 112.858 174.54 107.651 194.09C99.3126 214.271 83.0524 230.161 67.7524 234.538V241.5H0V173.748H17.2138H19.2427Z"/>
      <!-- cabeça + corpo (canto inferior preenchido, já que a asa está levantada) -->
      <path id="body" fill="url(#gNavy)"/>
      <!-- fresta branca da asa onde ela passa por cima do corpo -->
      <g clip-path="url(#cBody)">
        <path id="wingHalo" fill="#fff" stroke="#fff" stroke-width="13" stroke-linejoin="round"/>
      </g>
      <!-- olho -->
      <g id="eye">
        <path fill="url(#gEye)" d="M69.3903 110.371C76.2067 108.909 82.7695 114.063 84.0893 121.915C85.4094 129.768 80.9918 125.877 74.1959 127.459C67.326 129.059 60.6415 135.397 59.3075 127.459C57.9732 119.522 62.5001 111.85 69.3903 110.371Z"/>
        <path id="eyeShine" fill="#fff" d="M71.0903 113.421C73.6424 113.137 75.9367 115.272 76.229 118.202C76.5214 121.132 74.9875 119.541 72.4401 119.869C69.8649 120.201 67.2406 122.278 66.9451 119.316C66.6496 116.354 68.5106 113.707 71.0903 113.421Z"/>
      </g>
      <!-- bico -->
      <g id="beak">
        <path id="beakUpper" fill="#FFAE00" d="M179.132 99.8812C172.155 93.3712 144.863 73.8894 114.949 73.8889C114.949 73.8889 109.372 79.238 106.458 83.3099C99.2316 93.4048 95.8493 101.633 95.3198 113.872C94.7347 127.402 97.4086 139.561 104.816 150.534C128.637 147.9 153.08 142.994 176.874 149.314C178.798 149.825 181.052 150.82 182.952 151.152C185.26 152.79 187.745 154.387 190.102 155.955C190.611 154.012 191.449 151.791 192.098 149.857C197.051 135.12 194.008 115.537 183.245 104.649C182.461 103.059 180.409 101.08 179.132 99.8812Z"/>
        <!-- o logo original desenha o bico duas vezes (borda mais nítida) -->
        <path id="beakUpper2" fill="#FFAE00"/>
        <g id="mouth" clip-path="url(#cBelowB)" opacity="0">
          <path id="mouthShape" fill="#6E1402"/>
        </g>
        <g id="jaw">
          <path fill="url(#gJaw)" d="M168.29 136.077C166.311 134.815 160.911 131.495 157.773 130.767C130.085 110.901 95.3333 113.666 95.3198 113.814C94.7347 127.343 97.4086 139.561 104.816 150.534C108.775 150.097 112.584 149.593 116.579 149.089L116.579 149.089C136.624 146.56 157.034 143.986 176.874 149.255C177.656 149.463 178.492 149.75 179.337 150.041L179.339 150.041C180.572 150.466 181.824 150.896 182.952 151.093C184.66 152.306 186.466 153.497 188.245 154.669C188.869 155.081 189.49 155.49 190.102 155.897C190.47 154.491 191.011 152.938 191.528 151.455C191.725 150.889 191.919 150.333 192.098 149.798C196.106 137.872 174.2 139.934 168.29 136.077Z"/>
        </g>
        <path fill="url(#gTip)" d="M183.252 104.651C194.014 115.538 197.058 135.122 192.105 149.859C191.456 151.793 187.725 159.256 187.216 161.2C186.549 159.92 185.692 156.107 182.959 151.154C178.567 141.239 166.847 134.365 157.777 130.77C160.115 118.167 169.679 106.501 183.252 104.651Z"/>
      </g>
    </g>
  </g>

  <!-- asa levantada: fica na frente da moldura do ícone (sai para fora, como a do flamingo) -->
  <g id="charWing">
    <path id="wingFill" fill="url(#gWing)" filter="url(#fWingShadow)"/>
  </g>
</svg>

<script>
(() => {
  // ---- ritmo (medido no vídeo do flamingo: aceno a cada ~0,44 s, piscada a cada ~1,3 s) ----
  const LOOP = 5.0;                         // duração do loop (s)
  const WAVES = 11;                         // acenos por loop (~0,45 s cada)
  const BLINKS = [0.55, 1.80, 3.05, 4.30];  // início de cada piscada (s)
  const BEAK = [[0.15, 0.95], [2.65, 3.45]];// bico abrindo ("oi!"): início e fim (s)

  const W = 2 * Math.PI * WAVES / LOOP;
  const rad = d => d * Math.PI / 180;
  const clamp01 = x => Math.max(0, Math.min(1, x));
  const smooth = (a, b, x) => { const t = clamp01((x - a) / (b - a)); return t * t * (3 - 2 * t); };
  const easeInOut = x => x < 0.5 ? 2 * x * x : 1 - Math.pow(-2 * x + 2, 2) / 2;
  const $ = id => document.getElementById(id);

  // Cabeça + corpo do logo, com o canto inferior esquerdo preenchido e
  // estendido para fora da moldura (assim o balanço não abre frestas).
  const BODY = "M45.7886 82.5921C65.059 71.2739 87.3857 67.5874 108.798 71.9265C100.889 79.3726 94.7922 88.7268 91.2525 99.2542C90.6736 99.0249 89.8469 98.8871 88.9295 98.8028C85.6809 98.0843 82.3035 97.6992 78.8388 97.6992C53.1485 97.7 32.3218 118.526 32.3215 144.216C32.3224 169.906 53.1488 190.733 78.8388 190.734C90.9017 190.733 101.891 186.137 110.157 178.606C122.699 191.089 139.578 210.298 147.529 239.964L153.2 262L-30 262L-30 168C-12 166 -0.9 160 -0.25 154.2C0 152.4 0.2 150.7 0.506044 149.148C1.08558 145.499 1.88508 141.889 2.89847 138.347C9.5378 114.455 24.9905 94.3691 45.7886 82.5921Z";
  $('body').setAttribute('d', BODY);
  $('bodyClipPath').setAttribute('d', BODY);
  $('mouthShape').setAttribute('d', $('beakUpper').getAttribute('d'));
  $('beakUpper2').setAttribute('d', $('beakUpper').getAttribute('d'));

  // ---- asa ----
  // Coordenadas locais: ombro em (0,0), asa apontando para cima (-y).
  const S = [26, 205];                      // ombro, em coordenadas do ícone
  const ARM = { a: [0, 0], ra: 22, b: [5, -52], rb: 21 };   // massa da asa (borda lisa, do lado da cabeça)
  const WRIST = [5, -52];
  // penas: saem de pontos ao longo do "osso" da asa; cada uma mais curta e mais aberta,
  // formando a borda recortada do lado de fora
  const FEATHERS = [
    { base: [5, -52],  br: 17, ang: -6,  len: 70, r: 14.0, lag: 0.0 },
    { base: [2, -38],  br: 17, ang: -18, len: 66, r: 14.0, lag: 0.45 },
    { base: [-1, -24], br: 17, ang: -31, len: 60, r: 13.5, lag: 0.9 },
    { base: [-4, -10], br: 17, ang: -45, len: 50, r: 13.0, lag: 1.35 },
  ];

  const rot = (p, a, c) => {
    const s = Math.sin(a), co = Math.cos(a), dx = p[0] - c[0], dy = p[1] - c[1];
    return [c[0] + dx * co - dy * s, c[1] + dx * s + dy * co];
  };
  const f3 = p => p[0].toFixed(3) + ' ' + p[1].toFixed(3);

  // duas circunferências ligadas pelas tangentes externas; todas no mesmo sentido,
  // então a união das cápsulas sai certa com a regra de preenchimento nonzero
  function capsule(A, ra, B, rb) {
    const dx = B[0] - A[0], dy = B[1] - A[1], d = Math.hypot(dx, dy);
    const u = [dx / d, dy / d], n = [-u[1], u[0]];
    const s = Math.max(-1, Math.min(1, (ra - rb) / d)), c = Math.sqrt(1 - s * s);
    const mp = [u[0] * s + n[0] * c, u[1] * s + n[1] * c];
    const mm = [u[0] * s - n[0] * c, u[1] * s - n[1] * c];
    const P = (C, r, m) => [C[0] + r * m[0], C[1] + r * m[1]];
    const a1 = P(A, ra, mp), b1 = P(B, rb, mp), b2 = P(B, rb, mm), a2 = P(A, ra, mm);
    const span = 2 * Math.acos(s);
    const largeB = span > Math.PI ? 1 : 0, largeA = (2 * Math.PI - span) > Math.PI ? 1 : 0;
    return `M${f3(a1)}L${f3(b1)}A${rb} ${rb} 0 ${largeB} 0 ${f3(b2)}L${f3(a2)}A${ra} ${ra} 0 ${largeA} 0 ${f3(a1)}Z`;
  }

  function wingPath(theta, beta, flutter) {
    const toIcon = p => { const q = rot(p, theta, [0, 0]); return [q[0] + S[0], q[1] + S[1]]; };
    let d = capsule(toIcon(ARM.a), ARM.ra, toIcon(ARM.b), ARM.rb);
    FEATHERS.forEach((F, i) => {
      // a ponta da asa dobra no punho (beta) e cada pena treme um pouco atrasada (flutter)
      const base = rot(F.base, beta * (1 - i * 0.2), WRIST);
      const ang = rad(F.ang) + beta + flutter[i];
      const dir = [Math.sin(ang), -Math.cos(ang)];
      const tip = [base[0] + F.len * dir[0], base[1] + F.len * dir[1]];
      d += capsule(toIcon(base), F.br, toIcon(tip), F.r);
    });
    return d;
  }

  // 0 = olho aberto, 1 = fechado
  function blink(t) {
    let m = 0;
    for (const b of BLINKS) for (const off of [-LOOP, 0, LOOP]) {
      const d = t - (b + off);
      let v = 0;
      if (d >= 0 && d < 0.07) v = (d / 0.07) ** 2;
      else if (d >= 0.07 && d < 0.13) v = 1;
      else if (d >= 0.13 && d < 0.25) v = 1 - easeInOut((d - 0.13) / 0.12);
      m = Math.max(m, v);
    }
    return m;
  }

  // 0 = bico fechado, 1 = aberto
  function beak(t) {
    let m = 0;
    for (const [a, b] of BEAK) for (const off of [-LOOP, 0, LOOP]) {
      const s = a + off, e = b + off;
      let v = 0;
      if (t >= s && t < s + 0.14) v = easeInOut((t - s) / 0.14);
      else if (t >= s + 0.14 && t < e - 0.18) v = 1;
      else if (t >= e - 0.18 && t < e) v = 1 - easeInOut((t - (e - 0.18)) / 0.18);
      m = Math.max(m, v);
    }
    return m;
  }

  const elChar = $('char'), elCharWing = $('charWing'), elEye = $('eye'), elShine = $('eyeShine');
  const elJaw = $('jaw'), elMouth = $('mouth'), elHalo = $('wingHalo'), elWing = $('wingFill');

  const q = new URLSearchParams(location.search);
  const REST = q.get('rest') === '1';       // ?rest=1 -> sem balanço, piscada nem bico (para comparar com o logo)
  if (q.get('fundo')) {                     // ?fundo=FFE3B4 -> testar outra cor de fundo
    $('outer').setAttribute('fill', '#' + q.get('fundo'));
    document.body.style.background = '#' + q.get('fundo');
  }

  window.LOOP = LOOP;
  window.renderFrame = (t) => {
    t = ((t % LOOP) + LOOP) % LOOP;
    const ph = W * t;

    // aceno
    const theta = rad(-35.5 + 11.5 * Math.sin(ph));
    const beta = rad(9 * Math.sin(ph - 1.2));
    const flutter = FEATHERS.map(F => rad(4.5 * Math.sin(ph - 1.6 - F.lag)));
    const d = wingPath(theta, beta, flutter);
    elHalo.setAttribute('d', d);
    elWing.setAttribute('d', d);

    // balanço da cabeça/corpo, no ritmo do aceno
    const dy = REST ? 0 : 1.6 * Math.sin(ph + 0.7);
    const r = REST ? 0 : 1.1 * Math.sin(ph + 1.5);
    const bob = `rotate(${r.toFixed(4)} 60 230) translate(0 ${dy.toFixed(4)})`;
    elChar.setAttribute('transform', bob);
    elCharWing.setAttribute('transform', bob);

    // piscada
    const bl = REST ? 0 : blink(t);
    elShine.setAttribute('opacity', (1 - smooth(0.25, 0.6, bl)).toFixed(3));
    elEye.setAttribute('transform', `translate(71.7 124) scale(1 ${(1 - 0.9 * bl).toFixed(4)}) translate(-71.7 -124)`);

    // bico
    const o = REST ? 0 : beak(t);
    elJaw.setAttribute('transform', `translate(96 0) skewY(${(10 * o).toFixed(4)}) translate(-96 0)`);
    elMouth.setAttribute('opacity', o > 0.01 ? 1 : 0);
  };

  window.renderFrame(0);

  // No navegador, roda ao vivo. Quando o render.js (Playwright) controla a página, não.
  if (!navigator.webdriver) {
    const t0 = performance.now();
    const tick = now => { window.renderFrame((now - t0) / 1000); requestAnimationFrame(tick); };
    requestAnimationFrame(tick);
  }
})();
</script>
</body>
</html>
